name: ms-decision-provider
version: 1.0.0
description: >-
  Microsoft-Decision-1 (Azure AI Foundry System One) decision provider for
  bounded agent decisions. Registers typed-decision tools (decision_noul,
  decision_choice, decision_score, decide) and an optional pre_tool_call gate
  that optionally asks for human approval before known-risk tool calls.
  Probabilities are preserved end-to-end so the consumer owns the threshold.
author: guglxni
license: MIT
requires_hermes: ">=0.21"
homepage: https://github.com/guglxni/ms-decision-provider
provides_tools:
  - decision_noul
  - decision_choice
  - decision_score
  - decide
provides_hooks:
  - pre_tool_call
requires_env:
  - name: AZURE_FOUNDRY_API_KEY
    description: "Azure AI Foundry API key for the resource hosting a Microsoft-Decision-1 deployment"
    url: "https://ai.azure.com"
    secret: true
  - name: AZURE_FOUNDRY_BASE_URL
    description: "Your Foundry resource base URL, e.g. https://<resource>.openai.azure.com (or .../openai/v1). Never sent anywhere if unset."
    url: "https://ai.azure.com"
    secret: false
